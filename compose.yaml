services:
  postgres:
    image: postgres:16-alpine
    container_name: attackdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: attackdesk
      POSTGRES_USER: attackdesk
      POSTGRES_PASSWORD: attackdesk
    ports:
      - "5432:5432"
    volumes:
      - attackdesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attackdesk -d attackdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  attackdesk-postgres-data:
